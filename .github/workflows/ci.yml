name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: yueyi-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yueyi-desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/check-ui.mjs
      - run: npm run build

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: yueyi-desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yueyi-desktop/src-tauri
      - run: cargo check --release
      - run: cargo test --lib --no-run
